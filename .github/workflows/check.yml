name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check public repository contract
        run: python tools/check_repository.py
      - name: Check host bootstrap syntax
        run: bash -n bootstrap/prepare-host.sh
      - name: Check history for credentials
        shell: bash
        run: |
          scanner_dir=$(mktemp -d)
          cd "$scanner_dir"
          curl --fail --location --retry 3 --output scanner.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check
          tar -xzf scanner.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$scanner_dir/gitleaks" git --redact --no-banner .
